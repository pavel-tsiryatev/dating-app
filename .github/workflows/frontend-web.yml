name: Frontend · web

on:
  pull_request:
    paths:
      - "frontend/web/**"
      - ".github/workflows/frontend-web.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Тесты HTTP-клиента, сервера и утилит
        run: npm test
      - name: Сборка
        run: npm run build
