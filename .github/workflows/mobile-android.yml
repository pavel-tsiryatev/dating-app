name: Mobile · Android APK

# Собирает APK мобильного приложения (frontend/mobile).
# - На любой ветке при изменениях в frontend/mobile: APK в артефактах запуска (Actions → запуск → Artifacts).
# - На main: ещё и GitHub Release с APK — его можно скачать прямо на телефон.
# - Вручную: Actions → «Mobile · Android APK» → Run workflow.
# Адрес API для сборки задаётся переменной репозитория MOBILE_API_URL (Settings → Secrets and variables → Actions → Variables).
# Без неё приложение спросит адрес сервера при первом входе; деморежим работает всегда.

on:
  push:
    paths:
      - "frontend/mobile/**"
      - ".github/workflows/mobile-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend/mobile
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.MOBILE_API_URL }}
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Зависимости
        run: npm ci

      - name: Проверка типов
        run: npx tsc --noEmit

      - name: Юнит-тесты
        run: npm test

      - name: Нативный проект Android (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Сборка APK
        working-directory: frontend/mobile/android
        # Только ARM: такие процессоры у всех телефонов, сборка вдвое быстрее и APK меньше
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Имя файла
        id: apk
        run: |
          name="campus-${GITHUB_RUN_NUMBER}-$(git rev-parse --short HEAD).apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -lh "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: campus-android-apk
          path: frontend/mobile/${{ steps.apk.outputs.name }}
          retention-days: 30

      - name: Релиз с APK (только main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: CAMPUS для Android · сборка ${{ github.run_number }}
          make_latest: true
          files: frontend/mobile/${{ steps.apk.outputs.name }}
          body: |
            APK мобильного приложения CAMPUS из коммита ${{ github.sha }}.

            Установка: скачай файл на Android-телефон, открой его и разреши установку из этого источника.
            Без сервера выбери «Посмотреть демо» на первом экране (код входа 123456).
